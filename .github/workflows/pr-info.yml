name: PR info

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Данные ПР
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Заголовок: $PR_TITLE"
          echo "Ветка: $PR_BRANCH"
